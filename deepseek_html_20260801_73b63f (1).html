<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Marcador Pádel NFC</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px;
            color: white;
            user-select: none;
        }

        .container {
            max-width: 800px;
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 30px;
            padding: 20px;
            backdrop-filter: blur(10px);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid rgba(255, 255, 255, 0.1);
        }

        .header h1 {
            font-size: 1.8rem;
            font-weight: 300;
            letter-spacing: 3px;
            background: linear-gradient(90deg, #f7971e, #ffd200);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header .subtitle {
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.5);
            margin-top: 5px;
        }

        /* Estado NFC */
        .nfc-status {
            text-align: center;
            padding: 10px;
            margin-bottom: 15px;
            border-radius: 15px;
            background: rgba(0, 0, 0, 0.3);
            font-size: 0.9rem;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .nfc-status .dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            display: inline-block;
            transition: all 0.3s;
        }

        .nfc-status .dot.inactive {
            background: #ff4444;
            box-shadow: 0 0 15px #ff444466;
        }

        .nfc-status .dot.active {
            background: #44ff88;
            box-shadow: 0 0 20px #44ff8866;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0%,
            100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.3);
            }
        }

        .nfc-status .dot.waiting {
            background: #ffaa44;
            box-shadow: 0 0 15px #ffaa4466;
        }

        .btn-nfc {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            padding: 6px 18px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.8rem;
            transition: all 0.3s;
        }

        .btn-nfc:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .btn-nfc:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        /* Marcador principal */
        .scoreboard {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            gap: 10px;
            margin: 15px 0 20px;
            align-items: center;
        }

        .team {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 20px;
            padding: 15px;
            text-align: center;
            transition: all 0.3s;
            border: 2px solid transparent;
            min-height: 180px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .team.active-team {
            border-color: #ffd700;
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.1);
        }

        .team .team-name {
            font-size: 1.2rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 5px;
        }

        .team .team-name .chip-id {
            font-size: 0.6rem;
            opacity: 0.5;
            display: block;
            font-weight: normal;
        }

        .team .points {
            font-size: 4rem;
            font-weight: 800;
            line-height: 1;
            margin: 5px 0;
        }

        .team .points-label {
            font-size: 0.7rem;
            opacity: 0.6;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .team .games {
            font-size: 1.2rem;
            opacity: 0.7;
            margin-top: 5px;
        }

        .team .games span {
            font-weight: bold;
            font-size: 1.6rem;
        }

        .team-1 .team-name {
            color: #ff6b6b;
        }
        .team-1 .points {
            color: #ff6b6b;
        }

        .team-2 .team-name {
            color: #4ecdc4;
        }
        .team-2 .points {
            color: #4ecdc4;
        }

        .vs {
            font-size: 1.2rem;
            font-weight: bold;
            opacity: 0.3;
            writing-mode: vertical-lr;
            letter-spacing: 5px;
        }

        /* Sets y estado del partido */
        .match-info {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 10px;
            margin: 15px 0;
            text-align: center;
        }

        .match-info .info-item {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 12px;
            padding: 10px;
        }

        .match-info .info-item .label {
            font-size: 0.6rem;
            text-transform: uppercase;
            opacity: 0.5;
            letter-spacing: 1px;
        }

        .match-info .info-item .value {
            font-size: 1.8rem;
            font-weight: bold;
        }

        .match-info .info-item .value.set-1 {
            color: #ffd700;
        }
        .match-info .info-item .value.set-2 {
            color: #ff6b6b;
        }
        .match-info .info-item .value.set-3 {
            color: #4ecdc4;
        }

        /* Mensajes y alertas */
        .message-area {
            text-align: center;
            min-height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 10px 0;
            padding: 10px;
            border-radius: 15px;
            font-weight: bold;
            font-size: 1.1rem;
            transition: all 0.3s;
        }

        .message-area.info {
            background: rgba(68, 136, 255, 0.2);
            color: #88bbff;
        }

        .message-area.success {
            background: rgba(68, 255, 136, 0.2);
            color: #88ffbb;
            animation: flashGreen 0.5s ease;
        }

        .message-area.warning {
            background: rgba(255, 170, 68, 0.2);
            color: #ffbb88;
            animation: flashOrange 0.5s ease;
        }

        .message-area.alert {
            background: rgba(255, 68, 68, 0.2);
            color: #ff8888;
            animation: flashRed 0.5s ease;
        }

        .message-area.winner {
            background: rgba(255, 215, 0, 0.25);
            color: #ffd700;
            font-size: 1.6rem;
            animation: pulseGold 1s infinite;
        }

        @keyframes flashGreen {
            0%,
            100% {
                background: rgba(68, 255, 136, 0.2);
            }
            50% {
                background: rgba(68, 255, 136, 0.5);
            }
        }

        @keyframes flashOrange {
            0%,
            100% {
                background: rgba(255, 170, 68, 0.2);
            }
            50% {
                background: rgba(255, 170, 68, 0.5);
            }
        }

        @keyframes flashRed {
            0%,
            100% {
                background: rgba(255, 68, 68, 0.2);
            }
            50% {
                background: rgba(255, 68, 68, 0.5);
            }
        }

        @keyframes pulseGold {
            0%,
            100% {
                transform: scale(1);
                opacity: 1;
            }
            50% {
                transform: scale(1.05);
                opacity: 0.9;
            }
        }

        /* Botones de control */
        .controls {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 10px;
            margin-top: 15px;
        }

        .controls button {
            padding: 12px;
            border: none;
            border-radius: 12px;
            font-size: 0.9rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .controls button:active {
            transform: scale(0.95);
        }

        .btn-reset {
            background: rgba(255, 68, 68, 0.2);
            color: #ff6666;
            border: 1px solid rgba(255, 68, 68, 0.3);
        }

        .btn-reset:hover {
            background: rgba(255, 68, 68, 0.3);
        }

        .btn-undo {
            background: rgba(255, 170, 68, 0.2);
            color: #ffaa44;
            border: 1px solid rgba(255, 170, 68, 0.3);
        }

        .btn-undo:hover {
            background: rgba(255, 170, 68, 0.3);
        }

        .btn-change-court {
            background: rgba(68, 136, 255, 0.2);
            color: #4488ff;
            border: 1px solid rgba(68, 136, 255, 0.3);
        }

        .btn-change-court:hover {
            background: rgba(68, 136, 255, 0.3);
        }

        .btn-change-court.active {
            background: rgba(255, 215, 0, 0.2);
            color: #ffd700;
            border-color: rgba(255, 215, 0, 0.3);
            animation: pulseGold 1s infinite;
        }

        .btn-test {
            background: rgba(255, 255, 255, 0.05);
            color: rgba(255, 255, 255, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.1);
            font-size: 0.7rem;
        }

        .btn-test:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        /* Footer */
        .footer {
            text-align: center;
            margin-top: 20px;
            padding-top: 15px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            font-size: 0.6rem;
            opacity: 0.3;
        }

        /* Responsive */
        @media (max-width: 600px) {
            .container {
                padding: 12px;
            }

            .scoreboard {
                gap: 5px;
            }

            .team {
                padding: 10px;
                min-height: 130px;
            }

            .team .points {
                font-size: 3rem;
            }

            .team .team-name {
                font-size: 0.9rem;
            }

            .team .games {
                font-size: 1rem;
            }
            .team .games span {
                font-size: 1.2rem;
            }

            .match-info .info-item .value {
                font-size: 1.3rem;
            }

            .controls {
                grid-template-columns: 1fr 1fr;
            }

            .controls button {
                font-size: 0.7rem;
                padding: 10px;
            }

            .header h1 {
                font-size: 1.3rem;
            }

            .vs {
                font-size: 0.8rem;
            }

            .message-area {
                font-size: 0.9rem;
                min-height: 40px;
            }
        }

        @media (max-width: 400px) {
            .team .points {
                font-size: 2.2rem;
            }
            .team {
                min-height: 100px;
                padding: 8px;
            }
            .match-info {
                grid-template-columns: 1fr 1fr 1fr;
                gap: 5px;
            }
            .match-info .info-item {
                padding: 6px;
            }
            .match-info .info-item .value {
                font-size: 1rem;
            }
        }

        /* Scroll suave para móvil */
        html {
            scroll-behavior: smooth;
        }

        /* Ocultar scrollbar en móvil */
        ::-webkit-scrollbar {
            width: 0;
            background: transparent;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1>🏸 PÁDEL NFC</h1>
            <div class="subtitle">Acerca el chip para sumar punto</div>
        </div>

        <!-- Estado NFC -->
        <div class="nfc-status" id="nfcStatus">
            <span class="dot inactive" id="nfcDot"></span>
            <span id="nfcText">NFC no disponible</span>
            <button class="btn-nfc" id="btnNfc" onclick="initNFC()">🔗 Conectar</button>
            <button class="btn-nfc" id="btnSimular" onclick="simularChip()" style="font-size:0.6rem;opacity:0.5;">🧪 Simular</button>
        </div>

        <!-- Marcador -->
        <div class="scoreboard">
            <div class="team team-1" id="team1">
                <div class="team-name">
                    EQUIPO 1
                    <span class="chip-id" id="chip1Id">Esperando chip...</span>
                </div>
                <div class="points" id="points1">0</div>
                <div class="points-label">PUNTOS</div>
                <div class="games">Juegos: <span id="games1">0</span></div>
            </div>

            <div class="vs">VS</div>

            <div class="team team-2" id="team2">
                <div class="team-name">
                    EQUIPO 2
                    <span class="chip-id" id="chip2Id">Esperando chip...</span>
                </div>
                <div class="points" id="points2">0</div>
                <div class="points-label">PUNTOS</div>
                <div class="games">Juegos: <span id="games2">0</span></div>
            </div>
        </div>

        <!-- Información del partido -->
        <div class="match-info">
            <div class="info-item">
                <div class="label">SET</div>
                <div class="value set-1" id="currentSet">1</div>
            </div>
            <div class="info-item">
                <div class="label">Punto de Oro</div>
                <div class="value" id="oroStatus" style="font-size:1rem;color:#ffd700;">⚪</div>
            </div>
            <div class="info-item">
                <div class="label">Cambio de cancha</div>
                <div class="value" id="courtChange" style="font-size:1rem;color:#4488ff;">✅</div>
            </div>
        </div>

        <!-- Área de mensajes -->
        <div class="message-area info" id="messageArea">
            🏁 Acerca el chip del equipo que ganó el punto
        </div>

        <!-- Controles -->
        <div class="controls">
            <button class="btn-undo" onclick="undoPoint()">↩ Deshacer</button>
            <button class="btn-change-court" id="btnCourt" onclick="toggleCourtChange()">🔄 Cambiar cancha</button>
            <button class="btn-reset" onclick="resetMatch()">🔄 Reiniciar partido</button>
        </div>

        <div class="footer">
            Los datos se guardan automáticamente · Offline ready
        </div>
    </div>

    <script>
        // ============================================================
        //  ESTADO DEL PARTIDO
        // ============================================================
        let state = {
            points: [0, 0],
            games: [0, 0],
            sets: [0, 0],
            currentSet: 1,
            maxSets: 3,
            gamesPerSet: 6,
            tiebreak: false,
            oroActive: false, // true cuando están 40-40
            courtChanged: false,
            history: [], // para deshacer
            teamChips: {
                // Se llenan cuando se leen los chips
                'EQUIPO_1': 0,
                'EQUIPO_2': 1
            },
            chipIds: {
                0: null,
                1: null
            },
            matchFinished: false,
            winner: null // 0 o 1
        };

        // ============================================================
        //  REFERENCIAS DOM
        // ============================================================
        const elPoints1 = document.getElementById('points1');
        const elPoints2 = document.getElementById('points2');
        const elGames1 = document.getElementById('games1');
        const elGames2 = document.getElementById('games2');
        const elCurrentSet = document.getElementById('currentSet');
        const elOroStatus = document.getElementById('oroStatus');
        const elCourtChange = document.getElementById('courtChange');
        const elMessage = document.getElementById('messageArea');
        const elNfcText = document.getElementById('nfcText');
        const elNfcDot = document.getElementById('nfcDot');
        const elBtnNfc = document.getElementById('btnNfc');
        const elBtnCourt = document.getElementById('btnCourt');
        const elChip1Id = document.getElementById('chip1Id');
        const elChip2Id = document.getElementById('chip2Id');
        const elTeam1 = document.getElementById('team1');
        const elTeam2 = document.getElementById('team2');

        // ============================================================
        //  PERSISTENCIA (LocalStorage)
        // ============================================================
        function saveState() {
            try {
                const data = {
                    ...state,
                    chipIds: state.chipIds,
                    teamChips: state.teamChips
                };
                localStorage.setItem('padelNFCState', JSON.stringify(data));
            } catch (e) { /* ignorar */ }
        }

        function loadState() {
            try {
                const raw = localStorage.getItem('padelNFCState');
                if (!raw) return false;
                const data = JSON.parse(raw);
                Object.assign(state, data);
                return true;
            } catch (e) {
                return false;
            }
        }

        // ============================================================
        //  ACTUALIZAR UI
        // ============================================================
        function updateUI() {
            // Puntos
            elPoints1.textContent = state.points[0];
            elPoints2.textContent = state.points[1];

            // Juegos
            elGames1.textContent = state.games[0];
            elGames2.textContent = state.games[1];

            // Set actual
            elCurrentSet.textContent = state.currentSet;

            // Punto de oro
            if (state.oroActive) {
                elOroStatus.textContent = '🥇 ORO';
                elOroStatus.style.color = '#ffd700';
            } else {
                elOroStatus.textContent = '⚪ Normal';
                elOroStatus.style.color = '#888';
            }

            // Cambio de cancha
            if (state.courtChanged) {
                elCourtChange.textContent = '🔄 ¡Cambiar!';
                elCourtChange.style.color = '#ffaa44';
                elBtnCourt.classList.add('active');
            } else {
                elCourtChange.textContent = '✅ Correcto';
                elCourtChange.style.color = '#4488ff';
                elBtnCourt.classList.remove('active');
            }

            // Equipo activo (último que tocó)
            // (se actualiza en sumarPunto)

            // Guardar
            saveState();
        }

        function showMessage(text, type = 'info') {
            elMessage.textContent = text;
            elMessage.className = 'message-area ' + type;
        }

        function updateChipDisplay() {
            if (state.chipIds[0]) {
                elChip1Id.textContent = 'ID: ' + state.chipIds[0].substring(0, 8) + '...';
            } else {
                elChip1Id.textContent = 'Esperando chip...';
            }
            if (state.chipIds[1]) {
                elChip2Id.textContent = 'ID: ' + state.chipIds[1].substring(0, 8) + '...';
            } else {
                elChip2Id.textContent = 'Esperando chip...';
            }
        }

        // ============================================================
        //  LÓGICA DE PUNTUACIÓN (Pádel con punto de oro)
        // ============================================================
        function getPointsText(p) {
            // Devuelve 0, 15, 30, 40 o "ORO"
            if (p === 0) return 0;
            if (p === 1) return 15;
            if (p === 2) return 30;
            if (p === 3) return 40;
            if (p >= 4) return 'ORO';
            return p;
        }

        function sumarPunto(teamIndex) {
            if (state.matchFinished) {
                showMessage('⛔ El partido ya terminó. Reinicia para jugar de nuevo.', 'alert');
                return;
            }

            if (!state.chipIds[0] || !state.chipIds[1]) {
                showMessage('⚠️ Registra ambos chips primero (acerca cada uno una vez)', 'warning');
                return;
            }

            // Guardar historia para deshacer
            state.history.push(JSON.stringify(state));

            // Sumar punto al equipo
            state.points[teamIndex]++;

            // Verificar si se ganó un juego
            checkGame(teamIndex);

            // Verificar si se ganó un set
            checkSet();

            // Verificar partido
            checkMatch();

            // Actualizar UI
            updateUI();

            // Mensaje
            const teamName = teamIndex === 0 ? 'Equipo 1' : 'Equipo 2';
            showMessage(`✅ Punto para ${teamName}`, 'success');

            // Efecto visual en el equipo
            const teamEl = teamIndex === 0 ? elTeam1 : elTeam2;
            teamEl.classList.add('active-team');
            setTimeout(() => teamEl.classList.remove('active-team'), 500);

            // Actualizar estado del punto de oro en UI
            updateOroStatus();
        }

        function checkGame(teamIndex) {
            const p1 = state.points[0];
            const p2 = state.points[1];

            // Punto de oro: si ambos tienen 40+ (3 puntos) y están empatados
            if (p1 >= 3 && p2 >= 3 && p1 === p2) {
                state.oroActive = true;
                showMessage('🥇 ¡PUNTO DE ORO! El siguiente punto gana el juego', 'warning');
                updateUI();
                return;
            }

            // Si hay punto de oro activo, el primero que sume gana
            if (state.oroActive) {
                // El que sumó (teamIndex) ganó el juego
                state.games[teamIndex]++;
                state.points = [0, 0];
                state.oroActive = false;
                showMessage(`🎾 Juego para ${teamIndex === 0 ? 'Equipo 1' : 'Equipo 2'}`, 'success');
                updateUI();
                checkCourtChange();
                return;
            }

            // Puntuación normal (sin deuce, punto de oro)
            // Si un jugador llega a 4 y el otro tiene 3 o menos, gana el juego
            if (p1 >= 4 && p1 - p2 >= 1) {
                state.games[0]++;
                state.points = [0, 0];
                state.oroActive = false;
                showMessage(`🎾 Juego para Equipo 1`, 'success');
                updateUI();
                checkCourtChange();
                return;
            }
            if (p2 >= 4 && p2 - p1 >= 1) {
                state.games[1]++;
                state.points = [0, 0];
                state.oroActive = false;
                showMessage(`🎾 Juego para Equipo 2`, 'success');
                updateUI();
                checkCourtChange();
                return;
            }

            // Si ambos llegan a 3 (40-40) se activa punto de oro
            if (p1 === 3 && p2 === 3) {
                state.oroActive = true;
                showMessage('🥇 ¡PUNTO DE ORO! El siguiente punto gana el juego', 'warning');
                updateUI();
            }
        }

        function checkSet() {
            const g1 = state.games[0];
            const g2 = state.games[1];
            const set = state.currentSet;

            // Si alguien llega a 6 juegos con diferencia de 2
            if ((g1 >= 6 || g2 >= 6) && Math.abs(g1 - g2) >= 2) {
                if (g1 > g2) {
                    state.sets[0]++;
                    showMessage(`🏆 ¡Equipo 1 gana el SET ${set}!`, 'winner');
                } else {
                    state.sets[1]++;
                    showMessage(`🏆 ¡Equipo 2 gana el SET ${set}!`, 'winner');
                }
                state.games = [0, 0];
                state.points = [0, 0];
                state.oroActive = false;
                state.currentSet++;
                updateUI();
                return;
            }

            // Tie-break (7-6)
            if (g1 === 6 && g2 === 6) {
                // Modo tie-break: se juega a 7 puntos con diferencia de 2
                // Lo manejamos en checkGame con un flag, pero simplificamos:
                // Si llegan a 7-6 en juegos, el que llega a 7 gana el set
                if (g1 >= 7 && g1 - g2 >= 1) {
                    state.sets[0]++;
                    showMessage(`🏆 ¡Equipo 1 gana el SET ${set} en tie-break!`, 'winner');
                    state.games = [0, 0];
                    state.points = [0, 0];
                    state.oroActive = false;
                    state.currentSet++;
                    updateUI();
                    return;
                }
                if (g2 >= 7 && g2 - g1 >= 1) {
                    state.sets[1]++;
                    showMessage(`🏆 ¡Equipo 2 gana el SET ${set} en tie-break!`, 'winner');
                    state.games = [0, 0];
                    state.points = [0, 0];
                    state.oroActive = false;
                    state.currentSet++;
                    updateUI();
                    return;
                }
            }
        }

        function checkMatch() {
            // Si un equipo llega a 2 sets (en 3 sets)
            if (state.sets[0] >= 2) {
                state.matchFinished = true;
                state.winner = 0;
                showMessage('🏆🏆🏆 ¡EQUIPO 1 CAMPEÓN! 🏆🏆🏆', 'winner');
                updateUI();
                return;
            }
            if (state.sets[1] >= 2) {
                state.matchFinished = true;
                state.winner = 1;
                showMessage('🏆🏆🏆 ¡EQUIPO 2 CAMPEÓN! 🏆🏆🏆', 'winner');
                updateUI();
                return;
            }
            // Si se acabaron los sets (3 sets jugados)
            if (state.currentSet > state.maxSets) {
                state.matchFinished = true;
                if (state.sets[0] > state.sets[1]) {
                    state.winner = 0;
                    showMessage('🏆🏆🏆 ¡EQUIPO 1 CAMPEÓN! 🏆🏆🏆', 'winner');
                } else if (state.sets[1] > state.sets[0]) {
                    state.winner = 1;
                    showMessage('🏆🏆🏆 ¡EQUIPO 2 CAMPEÓN! 🏆🏆🏆', 'winner');
                } else {
                    showMessage('🤝 Partido empatado', 'info');
                }
                updateUI();
            }
        }

        function checkCourtChange() {
            // Regla estándar: se cambia de cancha cuando la suma de juegos es impar
            const totalGames = state.games[0] + state.games[1];
            // Pero también hay que considerar los juegos de sets anteriores
            // Simplificamos: usamos el total de juegos en el set actual
            // La regla real: se cambia al finalizar el primer juego, y luego cada 2 juegos
            // Es decir, se cambia cuando (juegos totales del set) es impar
            if (totalGames % 2 === 1) {
                state.courtChanged = true;
                showMessage('🔄 ¡Cambio de cancha! La suma de juegos es impar', 'warning');
                updateUI();
            } else {
                state.courtChanged = false;
                updateUI();
            }
        }

        function updateOroStatus() {
            // Se actualiza en updateUI
        }

        // ============================================================
        //  DESHACER
        // ============================================================
        function undoPoint() {
            if (state.history.length === 0) {
                showMessage('⛔ No hay acciones para deshacer', 'alert');
                return;
            }
            if (state.matchFinished) {
                showMessage('⛔ No se puede deshacer en partido terminado', 'alert');
                return;
            }
            const prev = JSON.parse(state.history.pop());
            Object.assign(state, prev);
            // Restaurar referencias de objetos
            state.history = state.history || [];
            state.teamChips = state.teamChips || { 'EQUIPO_1': 0, 'EQUIPO_2': 1 };
            state.chipIds = state.chipIds || { 0: null, 1: null };
            state.matchFinished = false;
            state.winner = null;
            updateUI();
            updateChipDisplay();
            showMessage('↩ Deshecho el último punto', 'info');
        }

        // ============================================================
        //  REINICIAR
        // ============================================================
        function resetMatch() {
            if (!confirm('¿Reiniciar completamente el partido?')) return;
            state.points = [0, 0];
            state.games = [0, 0];
            state.sets = [0, 0];
            state.currentSet = 1;
            state.oroActive = false;
            state.courtChanged = false;
            state.history = [];
            state.matchFinished = false;
            state.winner = null;
            // No borramos los chips registrados
            updateUI();
            updateChipDisplay();
            showMessage('🔄 Partido reiniciado', 'info');
        }

        // ============================================================
        //  CAMBIO DE CANCHA MANUAL
        // ============================================================
        function toggleCourtChange() {
            state.courtChanged = !state.courtChanged;
            if (state.courtChanged) {
                showMessage('🔄 Cambio de cancha marcado manualmente', 'warning');
            } else {
                showMessage('✅ Cambio de cancha restablecido', 'info');
            }
            updateUI();
        }

        // ============================================================
        //  NFC - LECTURA DE CHIPS
        // ============================================================
        let nfcReader = null;
        let nfcSupported = false;

        async function initNFC() {
            try {
                // Verificar soporte
                if (!('NDEFReader' in window)) {
                    showMessage('❌ Este navegador no soporta NFC. Usa Chrome en Android.', 'alert');
                    elNfcText.textContent = '❌ No soportado';
                    elNfcDot.className = 'dot inactive';
                    return;
                }

                nfcSupported = true;
                elNfcText.textContent = '⏳ Leyendo...';
                elNfcDot.className = 'dot waiting';

                nfcReader = new NDEFReader();
                await nfcReader.scan();

                elNfcText.textContent = '📡 Escuchando chips...';
                elNfcDot.className = 'dot active';
                elBtnNfc.disabled = true;
                showMessage('📡 Acerca un chip NFC (Equipo 1 o Equipo 2)', 'info');

                nfcReader.addEventListener('reading', ({ message, serialNumber }) => {
                    handleNFCRead(serialNumber);
                });

                nfcReader.addEventListener('error', (err) => {
                    console.error('Error NFC:', err);
                    elNfcText.textContent = '⚠️ Error: ' + err.message;
                    elNfcDot.className = 'dot inactive';
                });

            } catch (error) {
                console.error('Error al iniciar NFC:', error);
                elNfcText.textContent = '⚠️ Error: ' + error.message;
                elNfcDot.className = 'dot inactive';
                showMessage('❌ Error NFC: ' + error.message, 'alert');
            }
        }

        function handleNFCRead(serialNumber) {
            if (!serialNumber) {
                showMessage('⚠️ Chip sin ID detectado', 'warning');
                return;
            }

            // Recortar el serial para mostrarlo
            const shortId = serialNumber.substring(0, 12);

            // Determinar si es Equipo 1 o Equipo 2 (primera vez que se lee)
            // Si el chip ya está registrado, simplemente suma punto
            let teamIndex = null;

            // Buscar si el chip ya está asignado
            for (let i = 0; i < 2; i++) {
                if (state.chipIds[i] === serialNumber) {
                    teamIndex = i;
                    break;
                }
            }

            // Si no está asignado, asignarlo al primer equipo libre
            if (teamIndex === null) {
                if (state.chipIds[0] === null) {
                    state.chipIds[0] = serialNumber;
                    teamIndex = 0;
                    showMessage(`✅ Chip registrado como EQUIPO 1 (${shortId})`, 'success');
                } else if (state.chipIds[1] === null) {
                    state.chipIds[1] = serialNumber;
                    teamIndex = 1;
                    showMessage(`✅ Chip registrado como EQUIPO 2 (${shortId})`, 'success');
                } else {
                    // Ambos chips ya registrados, buscar coincidencia
                    showMessage(`⚠️ Chip ${shortId} no registrado. Ya hay 2 equipos.`, 'warning');
                    return;
                }
                updateChipDisplay();
                updateUI();
                // No sumamos punto en registro
                return;
            }

            // Si el chip ya está registrado, sumar punto
            if (teamIndex !== null) {
                const teamName = teamIndex === 0 ? 'Equipo 1' : 'Equipo 2';
                showMessage(`📡 Chip ${teamName} detectado - Sumando punto`, 'success');
                sumarPunto(teamIndex);
                // Feedback háptico (vibración)
                if (navigator.vibrate) {
                    navigator.vibrate(100);
                }
            }
        }

        // ============================================================
        //  SIMULACIÓN (para pruebas sin NFC)
        // ============================================================
        function simularChip() {
            // Simula la lectura de un chip alternando entre equipos
            if (!state.chipIds[0]) {
                state.chipIds[0] = 'SIM_001';
                updateChipDisplay();
                showMessage('🧪 Chip simulado: EQUIPO 1', 'info');
                updateUI();
                return;
            }
            if (!state.chipIds[1]) {
                state.chipIds[1] = 'SIM_002';
                updateChipDisplay();
                showMessage('🧪 Chip simulado: EQUIPO 2', 'info');
                updateUI();
                return;
            }
            // Si ya están ambos, alternar
            const next = Math.random() < 0.5 ? 0 : 1;
            showMessage(`🧪 Simulando punto para ${next === 0 ? 'Equipo 1' : 'Equipo 2'}`, 'info');
            sumarPunto(next);
        }

        // ============================================================
        //  INICIALIZACIÓN
        // ============================================================
        function init() {
            // Cargar estado guardado
            const loaded = loadState();
            if (loaded) {
                // Asegurar que los objetos tengan las propiedades correctas
                state.teamChips = state.teamChips || { 'EQUIPO_1': 0, 'EQUIPO_2': 1 };
                state.chipIds = state.chipIds || { 0: null, 1: null };
                state.history = state.history || [];
                state.matchFinished = state.matchFinished || false;
                state.winner = state.winner || null;
                showMessage('📂 Partido cargado', 'info');
            } else {
                showMessage('🏁 Acerca el chip del equipo que ganó el punto', 'info');
            }

            updateUI();
            updateChipDisplay();

            // Detectar si NFC está disponible pero no iniciado
            if ('NDEFReader' in window) {
                elNfcText.textContent = '📡 NFC disponible';
                elNfcDot.className = 'dot waiting';
                elBtnNfc.disabled = false;
            } else {
                elNfcText.textContent = '❌ NFC no disponible (usa Chrome Android)';
                elNfcDot.className = 'dot inactive';
                elBtnNfc.disabled = true;
                showMessage('⚠️ Usa Chrome en Android para NFC', 'info');
            }

            // Soporte para pantalla completa en móvil
            document.addEventListener('click', () => {
                if (document.documentElement.requestFullscreen && window.innerWidth < 800) {
                    // No forzamos, solo lo dejamos disponible
                }
            });
        }

        // Ejecutar al cargar
        init();

        // Guardar automáticamente cada 5 segundos
        setInterval(saveState, 5000);

        // Recuperar si se cierra y abre
        window.addEventListener('beforeunload', saveState);

        console.log('🏸 Marcador Pádel NFC cargado');
        console.log('Estado:', state);
    </script>

</body>
